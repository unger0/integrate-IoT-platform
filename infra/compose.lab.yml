# APENAS LABORATÓRIO: NÃO IMPLEMENTA SEGURANÇA DE PRODUÇÃO.
# Multiplataforma (Arch Linux é o ambiente principal); portas publicadas somente em loopback.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iot_laboratorio
      POSTGRES_USER: iot_lab
      POSTGRES_PASSWORD: iot_lab_nao_producao
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iot_lab -d iot_laboratorio']
      interval: 5s
      retries: 10
  api:
    build: ../services/central
    environment:
      DATABASE_URL: postgresql://iot_lab:iot_lab_nao_producao@db:5432/iot_laboratorio
    depends_on:
      db: {condition: service_healthy}
    ports:
      - '127.0.0.1:8000:8000'
  edge:
    build: ../services/edge
    environment:
      SQLITE_PATH: /data/edge.sqlite
      CENTRAL_URL: http://api:8000/api/v1/ingestao/lote
      SYNC_INTERVAL_SECONDS: '8'
    volumes:
      - edgequeue:/data
    depends_on:
      - api
    ports:
      - '127.0.0.1:8001:8001'
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - '127.0.0.1:1883:1883'
  mqtt-bridge:
    profiles: ['mqtt']
    build: ../services/mqtt-bridge
    environment:
      BROKER_HOST: mosquitto
      CENTRAL_INGEST_URL: http://api:8000/api/v1/ingestao
    depends_on:
      - api
      - mosquitto
volumes:
  pgdata:
  edgequeue:
