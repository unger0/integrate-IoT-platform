openapi: 3.0.3
info:
  title: Plataforma IoT Integrada - API inicial (laboratório)
  version: 0.7.0
  description: Apenas um subconjunto ilustrativo da API pretendida; a API de produção requer OIDC/RBAC e todos os contratos completos.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Diagnóstico simples de laboratório
      responses:
        '200': {description: OK}
  /api/v1/dispositivos:
    get:
      summary: Listar até 500 dispositivos filtrados por inquilino (filtra por tenant (modo JWT demo opt-in))
      parameters:
        - {name: inquilino, in: query, required: true, schema: {type: string}}
        - {name: limite, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        '200': {description: Inventário filtrado}
    post:
      summary: Cadastrar dispositivo (laboratório, sem emissão de credenciais)
      responses:
        '201': {description: Dispositivo cadastrado}
  /api/v1/ingestao:
    post:
      summary: Receber telemetria HTTP (subconjunto do contrato canônico)
      responses:
        '202': {description: Aceita ou duplicada sem repetir persistência}
        '400': {description: Erro de validação}
  /api/v1/ingestao/lote:
    post:
      summary: Receber lote com resultado por mensagem
      responses:
        '200': {description: Relatório individual de aceitação/recusa}
  /api/v1/dispositivos/{id}/telemetria:
    get:
      summary: Histórico ordenado por timestamp original
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Lista de medições}
  /api/v1/catalogo/dominios:
    get:
      summary: Listar domínios da organização declarada (filtra por tenant (modo JWT demo opt-in))
      parameters:
        - {name: inquilino, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Domínios cadastrados}
    post:
      summary: Criar domínio da organização (laboratório)
      responses:
        '201': {description: Domínio cadastrado}
  /api/v1/catalogo/perfis:
    post:
      summary: Criar perfil e faixas de grandezas (laboratório)
      responses:
        '201': {description: Perfil criado}
        '409': {description: Perfil já cadastrado}
    get:
      summary: Listar perfis pelo parâmetro inquilino
      responses:
        '200': {description: Relação de perfis}
  /api/v1/dispositivos/{id}/perfil:
    put:
      summary: Vincular um perfil a dispositivo existente
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Perfil vinculado}
        '400': {description: Perfil incompatível}

  /api/v1/regras:
    get:
      summary: Listar regras de limiar da organização (laboratório)
      responses:
        '200': {description: Regras configuradas}
    post:
      summary: Criar regra simples por dispositivo/grandeza
      responses:
        '201': {description: Regra criada}
        '403': {description: Papel ou organização recusados no modo JWT}
  /api/v1/alarmes:
    get:
      summary: Consultar alarmes e seu estado
      responses:
        '200': {description: Alarmes registrados}
  /api/v1/alarmes/{id}/reconhecer:
    post:
      summary: Reconhecer um alarme ativo
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Alarme reconhecido}
  /api/v1/alarmes/{id}/resolver:
    post:
      summary: Resolver manualmente um alarme em aberto
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Alarme resolvido}

  /api/v1/observabilidade/resumo:
    get:
      summary: Resumo historico de telemetria e alarmes por organizacao
      parameters:
        - {name: inquilino, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Indicadores historicos filtrados por organizacao}
        '403': {description: Papel ou organizacao nao autorizados}
  /metrics:
    get:
      summary: Metricas globais Prometheus (fora do OpenAPI automatico)
      description: No modo JWT, disponivel somente ao papel administrador. Em modo aberto, somente laboratorio local.
      responses:
        '200': {description: Formato texto Prometheus}
        '403': {description: Permissao insuficiente}
